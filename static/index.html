<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cinzas de Morvath</title>
<style>
  :root { --ouro: #c9a227; --texto: #d8cfb8; --fundo: #07080b; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fundo); color: var(--texto); font-family: Georgia, serif; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; }
  h1 { font-weight: normal; letter-spacing: 6px; color: var(--ouro); margin: 0 0 4px; text-align: center; }
  .sub { color: #8a8270; font-style: italic; margin: 0 0 24px; text-align: center; }
  input, button { font: inherit; padding: 10px 14px; background: #111318; color: var(--texto); border: 1px solid #3a3528; }
  button { cursor: pointer; letter-spacing: 2px; }
  button:hover:not(:disabled) { border-color: var(--ouro); color: var(--ouro); }
  button:disabled { opacity: 0.4; cursor: default; }
  .hidden { display: none !important; }

  #login { display: grid; gap: 10px; width: min(320px, 100%); }
  #login .linha { display: flex; gap: 10px; }
  #login .linha button { flex: 1; }
  #erro { color: #b33; min-height: 20px; margin: 0; font-size: 14px; }

  #area { width: min(960px, 100%); }
  .topo { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 14px; color: #8a8270; }
  .topo button { padding: 4px 10px; font-size: 12px; }
  .palco { position: relative; }
  canvas { width: 100%; aspect-ratio: 16 / 9; display: block; background: #000; outline: none; }

  /* Painel entre cenas */
  #painel { position: absolute; inset: 0; background: rgba(5,5,8,0.86); display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; padding: 24px; gap: 14px; overflow-y: auto; }
  #painel .pensando { font-style: italic; color: #8a8270; animation: pulsar 1.6s infinite; }
  @keyframes pulsar { 50% { opacity: 0.4; } }
  .titulo-cena { letter-spacing: 4px; color: var(--ouro); font-size: clamp(18px, 3vw, 28px); margin: 0; }
  .fala { font-size: clamp(16px, 2.4vw, 22px); font-style: italic; max-width: 680px; color: #efe4c8; margin: 0; }
  .dica { border: 1px solid #3a3528; padding: 8px 16px; color: var(--ouro); font-size: 15px; margin: 0; }
  .dica::before { content: "✦ Mensagem no chão: "; color: #8a8270; }
  .mudancas { font-family: system-ui, sans-serif; font-size: 13px; color: #9a927e; max-width: 640px; line-height: 1.6; }
  .mudancas b { color: #e0b85a; font-weight: 600; }
  .ferramentas { font-family: monospace; font-size: 12px; color: #6f6a5d; margin: 0; }
  .recompensas { color: #8fe3ff; font-family: system-ui, sans-serif; font-size: 14px; margin: 0; }
  .trilha { font-family: system-ui, sans-serif; font-size: 12px; color: #6f6a5d; letter-spacing: 2px; }
  .trilha .feita { color: #8a8270; } .trilha .agora { color: var(--ouro); }
  #painel a { color: #6f6a5d; font-size: 13px; }
  .botoes { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

  /* Menu da fogueira */
  #menu { position: absolute; inset: 0; background: rgba(6,6,10,0.94); display: flex; flex-direction: column; padding: 14px 18px; gap: 8px; }
  .menu-topo { display: flex; justify-content: space-between; align-items: center; }
  .menu-almas { color: #8fe3ff; font-size: 16px; }
  .menu-abas { display: flex; gap: 6px; flex-wrap: wrap; }
  .menu-abas button { padding: 6px 10px; font-size: 13px; letter-spacing: 1px; }
  .menu-abas button.ativa { border-color: var(--ouro); color: var(--ouro); }
  .menu-msg { min-height: 18px; font-family: system-ui, sans-serif; font-size: 13px; color: #e0b85a; }
  .menu-corpo { flex: 1; overflow-y: auto; font-family: system-ui, sans-serif; font-size: 14px; }
  .menu-corpo .fala { font-family: Georgia, serif; font-size: 16px; margin-bottom: 10px; }
  .menu-corpo h4 { margin: 12px 0 6px; color: var(--ouro); font-weight: normal; letter-spacing: 2px; }
  .linha-item { display: flex; align-items: center; gap: 10px; padding: 6px 4px; border-bottom: 1px solid #1d1b16; }
  .linha-item canvas { width: 32px; height: 32px; image-rendering: pixelated; background: #0e0f13; border: 1px solid #2c281f; }
  .linha-item .desc { flex: 1; color: #b8b09c; }
  .linha-item .desc b { color: #efe4c8; }
  .linha-item .valor { width: 32px; text-align: center; font-size: 18px; color: var(--ouro); }
  .linha-item .preco { color: #8fe3ff; min-width: 70px; text-align: right; }
  .linha-item.equipado { background: rgba(201,162,39,0.08); }
  .linha-item button { padding: 6px 12px; font-size: 13px; }
  .desconto { color: #7be07b !important; }
  .nota { color: #6f6a5d; font-size: 12px; }
  .ficha { color: #b8b09c; line-height: 1.8; }
  .aviso-almas { color: #7be07b; }
  .chat { max-height: 260px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
  .chat p { margin: 0; padding: 6px 10px; border-radius: 4px; }
  .chat .user { background: #15171c; align-self: flex-end; }
  .chat .assistant { background: #1c1712; color: #efe4c8; font-family: Georgia, serif; font-style: italic; }
  .chat-form { display: flex; gap: 8px; }
  .chat-form input { flex: 1; font-family: system-ui, sans-serif; font-size: 14px; }
  /* Escolha de classe */
  .classes { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; width: 100%; max-width: 920px; }
  @media (max-width: 760px) { .classes { grid-template-columns: repeat(2, 1fr); } }
  .classe { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px; letter-spacing: 0; text-align: center; }
  .classe canvas { width: 110px; height: 110px; image-rendering: pixelated; background: #0b0c10; border: 1px solid #2c281f; }
  .classe b { color: var(--ouro); font-weight: normal; letter-spacing: 2px; font-size: 17px; }
  .classe .desc { font-family: system-ui, sans-serif; font-size: 12px; color: #b8b09c; line-height: 1.4; }
  .classe .atrib { font-family: system-ui, sans-serif; font-size: 11px; color: #8fb8cc; }
  .conselho { font-family: Georgia, serif; font-size: 17px; font-style: italic; color: #efe4c8; border-left: 3px solid var(--ouro); padding-left: 12px; }
</style>
</head>
<body>
  <h1>CINZAS DE MORVATH</h1>
  <p class="sub">Os guardiões aprendem com cada uma de suas mortes.</p>

  <form id="login">
    <input id="usuario" placeholder="Nome" autocomplete="username">
    <input id="senha" type="password" placeholder="Senha" autocomplete="current-password">
    <p id="erro"></p>
    <div class="linha">
      <button data-acao="entrar">Entrar</button>
      <button data-acao="registrar">Novo jogo</button>
    </div>
  </form>

  <div id="area" class="hidden">
    <div class="topo">
      <span id="info"></span>
      <span>
        <button id="som" title="Tecla M">♪ música</button>
        <button id="efeitos" title="Tecla N">🔊 efeitos</button>
        <button id="sair">Sair</button>
      </span>
    </div>
    <div class="palco">
      <canvas id="tela" width="960" height="540" tabindex="0"></canvas>
      <div id="painel" class="hidden"></div>
      <div id="menu" class="hidden"></div>
    </div>
  </div>

<script type="module">
import { iniciarLuta, iniciarFase, carregarSprites, carregarSons, nomeDoChefe, pausar, retomar, aplicarPersonagem,
  relatorioDaCena } from "/static/jogo.js";
import { tocar, alternarMudo, estaMudo } from "/static/musica.js";
import { som, liberarAudio, alternarEfeitos, efeitosMudos } from "/static/sons.js";
import { abrirMenu } from "/static/menu.js";
import { desenharSprite, nQuadros, ciclo } from "/static/sprites.js";

// A campanha: fases e chefes em sequência (a mesma ordem de db.CENAS no servidor)
const CENAS = ["ruinas", "minotauro", "floresta", "cripta", "gorgona", "torre", "arquimago", "abismo", "arquidemonio"];
const CHEFES = ["minotauro", "gorgona", "arquimago", "arquidemonio"];
const NOMES = { ruinas: "Ruínas de Morvath", minotauro: "Morvath, o Guardião", floresta: "Floresta dos Sussurros",
  cripta: "Cripta dos Petrificados", gorgona: "Medrah, a Górgona", torre: "Torre das Cinzas",
  arquimago: "Ignar, o Arquimago", abismo: "Abismo Rubro", arquidemonio: "Azrakh, o Arquidemônio" };
const GOLPES = { minotauro: "Combo / Investida / Especiais", gorgona: "Chicote / Bote / Especiais",
  arquimago: "Cajado / Disparada / Especiais", arquidemonio: "Garras / Mergulho / Especiais" };
const ABA_DO_NPC = { fogueira: "descansar", guardia: "nivel", mercador: "loja", ferreiro: "ferreiro", cavaleiro_errante: "cavaleiro" };

const $ = (id) => document.getElementById(id);
let estado = null;       // cena, chefes, personagem, catálogo e loja (vindos do servidor)
let acaoDoBotao = null;  // o que o botão principal do painel (e o Enter) faz
const recursos = Promise.all([carregarSprites(), carregarSons()]);  // começa a baixar imagens e sons já no login

async function api(caminho, corpo) {
  const res = await fetch(caminho, corpo === undefined ? {} : {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(corpo),
  });
  const dados = await res.json();
  if (!res.ok) throw new Error(typeof dados.detail === "string" ? dados.detail : "Erro no servidor");
  return dados;
}

const proxima = (cena) => CENAS[CENAS.indexOf(cena) + 1] || null;
const contexto = () => ({ personagem: estado.personagem, catalogo: estado.catalogo });

function atualizarInfo() {
  const mortes = CHEFES.reduce((s, c) => s + estado.chefes[c].mortes, 0);
  $("info").textContent = `${estado.usuario} · ${NOMES[estado.cena]} · nível ${estado.personagem.nivel} · mortes em chefes: ${mortes}`;
}

function trilha(atual) {
  const i = CENAS.indexOf(atual);
  return `<div class="trilha">${CENAS.map((c, k) =>
    `<span class="${k < i ? "feita" : k === i ? "agora" : ""}">${k === i ? "▶ " : ""}${NOMES[c]}</span>`).join(" · ")}</div>`;
}

async function salvarCena(cena) {
  estado.cena = cena;
  atualizarInfo();
  await api("/api/progresso", { cena }).catch(() => {});
}

/**
 * Manda ao servidor o que mudou na cena (almas ganhas, itens usados/encontrados, almas recuperadas
 * ou deixadas ao morrer) e recebe o personagem atualizado. O servidor é quem guarda a verdade.
 */
async function sincronizar(extra = {}) {
  const r = relatorioDaCena();
  if (!r && !extra.morreu_em) return;
  try {
    const resp = await api("/api/personagem/sincronizar", { ...(r || {}), ...extra });
    estado.personagem = resp.personagem;
    aplicarPersonagem(estado.personagem, estado.catalogo);
    atualizarInfo();
  } catch { /* sem rede: tenta de novo na próxima sincronização */ }
}

async function recarregarLoja() {
  const e = await api("/api/estado");
  Object.assign(estado, { personagem: e.personagem, loja: e.loja, custo_nivel: e.custo_nivel, custo_melhoria: e.custo_melhoria });
}

// ===================== Telas =====================
async function abrirJogo() {
  estado = await api("/api/estado");
  $("login").classList.add("hidden");
  $("area").classList.remove("hidden");
  atualizarInfo();
  mostrarPainel(`<p class="pensando">Carregando...</p>`);
  await recursos;
  if (estado.personagem.classe) telaInicial();
  else telaClasse();
}

// Escolha da classe: só uma vez, no começo da jornada (o servidor recusa trocar depois)
function telaClasse() {
  const cat = estado.catalogo;
  const cartoes = Object.entries(cat.classes).map(([id, c]) => {
    const a = c.atributos;
    return `<button class="classe" data-classe="${id}">
      <canvas width="110" height="110" data-sprite="${c.sprite}" data-filtro="${c.filtro || ""}"></canvas>
      <b>${esc(c.nome)}</b>
      <span class="desc">${esc(c.descricao)}</span>
      <span class="atrib">${esc(cat.armas[c.arma].nome)}${c.escudo !== "nenhum" ? " · " + esc(cat.escudos[c.escudo].nome) : ""}</span>
      <span class="atrib">Vigor ${a.vigor} · Fôlego ${a.folego} · Força ${a.forca} · Fé ${a.fe}</span>
    </button>`;
  }).join("");
  mostrarPainel(`<p class="titulo-cena">ESCOLHA QUEM VOCÊ ERA</p>
    <p class="mudancas">A classe define o equipamento e os atributos iniciais. Não dá para trocar depois.</p>
    <div class="classes">${cartoes}</div><p id="erro-classe" class="recompensas"></p>`);
  for (const botao of document.querySelectorAll(".classe")) {
    botao.onclick = async () => {
      som("clique");
      try {
        const r = await api("/api/classe", { classe: botao.dataset.classe });
        Object.assign(estado, { personagem: r.personagem, loja: r.loja, custo_nivel: r.custo_nivel, custo_melhoria: r.custo_melhoria });
        atualizarInfo();
        telaInicial();
      } catch (err) { $("erro-classe").textContent = err.message; }
    };
  }
  animarRetratos();
}

// Retratos animados das classes (param sozinhos quando o painel muda)
function animarRetratos() {
  const telas = [...document.querySelectorAll("canvas[data-sprite]")];
  const quadro = (ts) => {
    if (!telas.length || !document.contains(telas[0])) return;
    for (const c of telas) {
      const g = c.getContext("2d"), sprite = c.dataset.sprite;
      g.clearRect(0, 0, c.width, c.height);
      // Um retrato com problema não apaga os outros
      try { desenharSprite(g, sprite, "parado", ciclo(ts / 1000, 8, nQuadros(sprite, "parado")), 55, 104, { filtro: c.dataset.filtro || null }); }
      catch (err) { console.warn(`retrato de ${sprite}:`, err); }
    }
    requestAnimationFrame(quadro);
  };
  requestAnimationFrame(quadro);
}

function telaInicial() {
  const cena = estado.cena, chefe = CHEFES.includes(cena);
  mostrarPainel(`
    <p class="titulo-cena">${NOMES[cena].toUpperCase()}</p>
    ${chefe ? `<p class="fala">“${esc(estado.chefes[cena].fala)}”</p>` : ""}
    ${trilha(cena)}
    <div class="botoes"><button id="acao">${cena === "ruinas" ? "Começar" : "Continuar"}</button><button id="fogueira">🔥 Fogueira</button></div>
    ${cena !== "ruinas" ? `<a href="#" id="recomecar">recomeçar a jornada do início</a>` : ""}`, () => jogar(cena));
  if ($("recomecar")) $("recomecar").onclick = async (e) => { e.preventDefault(); await salvarCena("ruinas"); telaInicial(); };
}

function jogar(cena) {
  $("painel").classList.add("hidden");
  tocar(cena);
  if (CHEFES.includes(cena)) lutarContra(cena);
  else jogarFase(cena);
}

let fogueiraDoMeio = null;  // { cena, x }: morrer depois de acendê-la recomeça dali (vale nesta sessão)

function jogarFase(cena) {
  const inicio = fogueiraDoMeio?.cena === cena ? fogueiraDoMeio.x : 120;
  iniciarFase(cena, {
    aoMorrer: async (x) => {
      await sincronizar({ morreu_em: { cena, x } });  // as almas ficam no chão, onde você caiu
      mostrarPainel(`<p class="titulo-cena">${NOMES[cena].toUpperCase()}</p>
        <p class="fala">As sombras reclamam mais uma alma.</p>
        ${estado.personagem.almas_perdidas ? `<p class="recompensas">Suas ${estado.personagem.almas_perdidas.qtd} almas ficaram onde você caiu.</p>` : ""}
        <div class="botoes"><button id="acao">${fogueiraDoMeio?.cena === cena ? "Voltar à fogueira" : "Tentar novamente"}</button>
        <button id="fogueira">🔥 Fogueira</button></div>`, () => jogar(cena));
    },
    aoAcenderFogueira: (x, final) => {
      sincronizar();
      if (final) { fogueiraDoMeio = null; salvarCena(proxima(cena)); }  // fogueira do fim: salva o progresso no servidor
      else fogueiraDoMeio = { cena, x };
    },
    aoAtravessarNevoa: async () => { await sincronizar(); jogar(proxima(cena)); },
    aoInteragir: (tipo) => abrirFogueira(tipo, CHEFES.includes(proxima(cena)) ? proxima(cena) : null, true),
  }, inicio, contexto());
}

function lutarContra(chefe) {
  const c = estado.chefes[chefe];
  iniciarLuta(chefe, c.estrategia, c.fala, (log, x) => aoFimDaLuta(chefe, log, x), contexto());
}

/** Abre o menu da fogueira. No meio de uma fase, o jogo fica pausado até voltar. */
async function abrirFogueira(tipo = "fogueira", chefe = null, emJogo = false) {
  if (emJogo) { pausar(); await sincronizar(); }
  await recarregarLoja();
  const descanso = tipo === "fogueira" || !emJogo;
  abrirMenu({
    raiz: $("menu"), estado, api, aba: ABA_DO_NPC[tipo] || "descansar", chefe, descanso,
    aoFechar: () => {
      atualizarInfo();
      if (emJogo) { aplicarPersonagem(estado.personagem, estado.catalogo, descanso); retomar(); }
    },
  });
}

async function aoFimDaLuta(chefe, log, x) {
  const nome = nomeDoChefe(chefe).split(",")[0];
  mostrarPainel(`<p class="pensando">${log.resultado === "morte"
    ? `${nome} reflete sobre a sua queda...` : `Das cinzas, ${nome} se lembra de você...`}</p>`);
  await sincronizar(log.resultado === "morte" ? { morreu_em: { cena: chefe, x } } : {});
  const antes = estado.chefes[chefe].estrategia;
  let r;
  try {
    r = await api(`/api/luta/${chefe}`, log);
    Object.assign(estado.chefes[chefe], { estrategia: r.estrategia, fala: r.fala, mortes: r.mortes, vitorias: r.vitorias });
    Object.assign(estado, { personagem: r.personagem, loja: r.loja });
  } catch (err) {
    r = { fala: err.message, dica: "", ferramentas: [], erro: null, estrategia: antes, recompensas: [] };
  }

  const relatorio = `
    <p class="fala">“${esc(r.fala)}”</p>
    ${r.dica ? `<p class="dica">${esc(r.dica)}</p>` : ""}
    <div class="mudancas">${descreverMudancas(chefe, antes, r.estrategia)}</div>
    ${r.ferramentas.length ? `<p class="ferramentas">ferramentas usadas pela IA: ${r.ferramentas.join(" → ")}</p>` : ""}
    ${r.erro ? `<p class="ferramentas">a IA falhou (${esc(r.erro).slice(0, 120)}); o chefe mantém a estratégia</p>` : ""}`;
  const fogueiraBtn = `<button id="fogueira">🔥 Fogueira</button>`;

  if (log.resultado === "morte") {
    mostrarPainel(relatorio + `<div class="botoes"><button id="acao">Tentar novamente</button>${fogueiraBtn}</div>`, () => jogar(chefe));
    return;
  }
  // Vitória: recompensas e a próxima cena (ou o fim da jornada)
  const ganhos = r.recompensas?.length ? `<p class="recompensas">Você obteve: ${r.recompensas.map(esc).join(" · ")}</p>` : "";
  const prox = proxima(chefe);
  if (prox) {
    await salvarCena(prox);
    mostrarPainel(`<p class="titulo-cena">${nomeDoChefe(chefe).toUpperCase()} FOI DERROTADO</p>` + ganhos + relatorio + trilha(prox) +
      `<div class="botoes"><button id="acao">Seguir para ${NOMES[prox]}</button>${fogueiraBtn}</div>`, () => jogar(prox));
  } else {
    tocar("vitoria");
    som("vitoria");
    mostrarPainel(`<p class="titulo-cena">A JORNADA TERMINOU</p>` + ganhos + relatorio +
      `<p class="fala">Os guardiões caíram. Mas eles se lembram de você.</p>
      <div class="botoes"><button id="acao">Enfrentar ${nome} de novo</button>${fogueiraBtn}</div>
      <a href="#" id="recomecar">recomeçar a jornada do início</a>`, () => jogar(chefe));
    $("recomecar").onclick = async (e) => { e.preventDefault(); await salvarCena("ruinas"); telaInicial(); };
  }
}

// Mostra em português o que a IA mudou no chefe
function descreverMudancas(chefe, a, n) {
  const pct = (v) => Math.round(v * 100) + "%";
  const rolagem = { nenhuma: "não", para_tras: "persegue quem rola para trás", para_frente: "pune quem rola por dentro" };
  const pesos = (p) => `${p.combo} / ${p.investida} / ${p.especial ?? p.salto}`;
  const itens = [
    ["Agressividade", pct(a.agressividade), pct(n.agressividade)],
    ["Atraso do 3º golpe", pct(a.atraso_terceiro_golpe), pct(n.atraso_terceiro_golpe)],
    ["Pune cura", a.punir_cura ? "sim" : "não", n.punir_cura ? "sim" : "não"],
    ["Pune esquiva", rolagem[a.punir_rolagem], rolagem[n.punir_rolagem]],
    [GOLPES[chefe], pesos(a.pesos), pesos(n.pesos)],
  ];
  const mudou = itens.filter(([, x, y]) => x !== y).map(([nome, x, y]) => `${nome}: ${x} → <b>${y}</b>`);
  const motivo = n.motivo ? `<br><i>“${esc(n.motivo)}”</i>` : "";
  return mudou.length ? "O guardião se adaptou:<br>" + mudou.join("<br>") + motivo : "O guardião manteve a estratégia.";
}
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

function mostrarPainel(html, acao = null) {
  $("painel").innerHTML = html;
  $("painel").classList.remove("hidden");
  acaoDoBotao = acao ? () => { som("clique"); acao(); } : null;
  if (acao) $("acao").onclick = acaoDoBotao;
  // O botão "Fogueira" dos painéis abre o menu (subir de nível, loja...) entre uma tentativa e outra
  if ($("fogueira")) {
    const proximoChefe = CHEFES.includes(estado.cena) ? estado.cena : null;
    $("fogueira").onclick = () => { som("clique"); abrirFogueira("fogueira", proximoChefe, false); };
  }
}

// ===================== Controles da página =====================
function atualizarBotaoSom() {
  $("som").textContent = estaMudo() ? "♪ mudo" : "♪ música";
  $("efeitos").textContent = efeitosMudos() ? "🔇 efeitos" : "🔊 efeitos";
}
$("som").onclick = () => { alternarMudo(); atualizarBotaoSom(); };
$("efeitos").onclick = () => { alternarEfeitos(); atualizarBotaoSom(); };
atualizarBotaoSom();

// Navegadores só liberam áudio depois de uma interação: o primeiro clique/tecla libera
addEventListener("pointerdown", liberarAudio);
addEventListener("keydown", (e) => {
  liberarAudio();
  if (e.target.tagName === "INPUT") return;  // digitando (login, chat do mercador): nada de atalhos
  const menuAberto = !$("menu").classList.contains("hidden");
  // Enter aciona o botão principal do painel; M liga/desliga a música; N, os efeitos
  if (e.key === "Enter" && !menuAberto && !$("painel").classList.contains("hidden") && acaoDoBotao) acaoDoBotao();
  if ($("area").classList.contains("hidden")) return;
  if (e.code === "KeyM") { alternarMudo(); atualizarBotaoSom(); }
  if (e.code === "KeyN") { alternarEfeitos(); atualizarBotaoSom(); }
});

$("login").onsubmit = async (e) => {
  e.preventDefault();
  try {
    await api("/api/" + e.submitter.dataset.acao, { usuario: $("usuario").value, senha: $("senha").value });
    abrirJogo();
  } catch (err) { $("erro").textContent = err.message; }
};

$("sair").onclick = async () => { await api("/api/sair", {}); location.reload(); };

abrirJogo().catch(() => {});  // se já estiver logado, vai direto ao jogo
</script>
</body>
