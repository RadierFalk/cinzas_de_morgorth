<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Banco Mestre S.A.</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #0f3d2e; display: grid; place-items: center; min-height: 100vh; }
  .card { background: #fff; width: min(640px, 100% - 32px); border-radius: 12px; border-top: 6px solid #d4af37; padding: 24px; box-sizing: border-box; }
  h1 { margin: 0; color: #0f3d2e; font-size: 22px; }
  h1 span { color: #d4af37; }
  .sub { color: #777; font-size: 13px; margin: 4px 0 16px; }
  input, button { font: inherit; padding: 10px; border-radius: 8px; border: 1px solid #ccc; }
  button { background: #d4af37; border: 0; font-weight: bold; cursor: pointer; }
  .linha { display: flex; gap: 8px; margin-top: 8px; }
  .linha input { flex: 1; }
  #erro { color: #b00020; font-size: 14px; min-height: 18px; }
  #mensagens { height: 55vh; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 8px 0; }
  .msg { max-width: 80%; padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; line-height: 1.4; }
  .user { align-self: flex-end; background: #0f3d2e; color: #fff; }
  .assistant { align-self: flex-start; background: #f3efe2; }
  .tools { display: block; font-size: 12px; color: #777; margin-top: 6px; }
  .topo { display: flex; justify-content: space-between; align-items: center; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="card">
  <div class="topo">
    <h1>Banco <span>Mestre</span> S.A. 🧼</h1>
    <button id="sair" class="hidden">Sair</button>
  </div>
  <p class="sub">Sátira. Personagens, banco e "serviços" são fictícios.</p>

  <!-- Login -->
  <form id="login">
    <div class="linha"><input id="usuario" placeholder="Usuário"></div>
    <div class="linha"><input id="senha" type="password" placeholder="Senha"></div>
    <p id="erro"></p>
    <div class="linha">
      <button data-acao="entrar">Entrar</button>
      <button data-acao="registrar">Criar conta</button>
    </div>
  </form>

  <!-- Chat -->
  <div id="chat" class="hidden">
    <div id="mensagens"></div>
    <form id="envio" class="linha">
      <input id="texto" placeholder="Fale com o Consultor Vorcado..." autocomplete="off">
      <button>Enviar</button>
    </form>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);

async function api(caminho, corpo) {
  const res = await fetch(caminho, corpo === undefined ? {} : {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(corpo),
  });
  const dados = await res.json();
  if (!res.ok) throw new Error(dados.detail);
  return dados;
}

function mostrar(role, texto, ferramentas = []) {
  const el = document.createElement("div");
  el.className = "msg " + role;
  // escapa o HTML e depois converte **negrito** do Markdown
  el.innerHTML = texto.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c])
                      .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  if (ferramentas.length) el.innerHTML += `<span class="tools">🔧 ${ferramentas.join(", ")}</span>`;
  $("mensagens").append(el);
  $("mensagens").scrollTop = $("mensagens").scrollHeight;
  return el;
}

async function abrirChat() {
  const { mensagens } = await api("/api/historico");
  $("login").classList.add("hidden");
  $("chat").classList.remove("hidden");
  $("sair").classList.remove("hidden");
  $("mensagens").innerHTML = "";
  mensagens.forEach((m) => mostrar(m.role, m.content));
  if (!mensagens.length) mostrar("assistant", "Bem-vindo ao Banco Mestre! Traga seu dinheiro sujo que eu devolvo limpinho e cheirando a amaciante. 🧺");
}

$("login").onsubmit = async (e) => {
  e.preventDefault();
  try {
    await api("/api/" + e.submitter.dataset.acao, { usuario: $("usuario").value, senha: $("senha").value });
    abrirChat();
  } catch (err) { $("erro").textContent = err.message; }
};

$("envio").onsubmit = async (e) => {
  e.preventDefault();
  const texto = $("texto").value.trim();
  if (!texto) return;
  $("texto").value = "";
  mostrar("user", texto);
  const aguarde = mostrar("assistant", "🧼 Colocando na máquina...");
  try {
    const r = await api("/api/chat", { texto });
    aguarde.remove();
    mostrar("assistant", r.resposta, r.ferramentas);
  } catch (err) { aguarde.textContent = "⚠️ " + err.message; }
};

$("sair").onclick = async () => { await api("/api/sair", {}); location.reload(); };

abrirChat().catch(() => {});  // se já estiver logado, abre direto o chat
</script>
</body>
</html>
